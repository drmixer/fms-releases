name: Windows installer validation

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact public release tag (for example v0.1.0)
        required: true
        type: string
      installer_sha256:
        description: SHA-256 for the exact x64 NSIS installer
        required: true
        type: string
      previous_tag:
        description: Optional prior release tag; requires previous_sha256
        required: false
        type: string
      previous_sha256:
        description: Optional prior installer SHA-256; requires previous_tag
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    # This workflow belongs only in the separate public binary repository. The
    # guard makes an accidental copy into a private repository a no-op.
    if: github.event.repository.private == false && github.repository == 'drmixer/fms-releases'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    env:
      FMS_PUBLIC_RUNNER_TEST: '1'
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_SHA256: ${{ inputs.installer_sha256 }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      PREVIOUS_SHA256: ${{ inputs.previous_sha256 }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-02
        with:
          persist-credentials: false

      - name: Validate requested public release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'release_tag must be vMAJOR.MINOR.PATCH.' }
          if ($env:RELEASE_SHA256 -notmatch '\A[A-Fa-f0-9]{64}\z') { throw 'installer_sha256 must be 64 hex characters.' }
          if ([string]::IsNullOrWhiteSpace($env:PREVIOUS_TAG) -xor [string]::IsNullOrWhiteSpace($env:PREVIOUS_SHA256)) { throw 'previous_tag and previous_sha256 must be supplied together.' }
          if ($env:PREVIOUS_TAG -and $env:PREVIOUS_TAG -notmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'previous_tag must be vMAJOR.MINOR.PATCH.' }
          if ($env:PREVIOUS_SHA256 -and $env:PREVIOUS_SHA256 -notmatch '\A[A-Fa-f0-9]{64}\z') { throw 'previous_sha256 must be 64 hex characters.' }
          if ($env:PREVIOUS_TAG -and [version]$env:PREVIOUS_TAG.Substring(1) -ge [version]$env:RELEASE_TAG.Substring(1)) { throw 'previous_tag must be older than release_tag.' }
          "VERSION=$($env:RELEASE_TAG.Substring(1))" | Add-Content $env:GITHUB_ENV
          if ($env:PREVIOUS_TAG) { "PREVIOUS_VERSION=$($env:PREVIOUS_TAG.Substring(1))" | Add-Content $env:GITHUB_ENV }

      - name: Download and verify public installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "FMS-$env:VERSION-windows-x64-nsis.exe"
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $asset --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Public release download failed.' }
          $path = Join-Path $env:RUNNER_TEMP $asset
          if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $env:RELEASE_SHA256.ToUpperInvariant()) { throw 'Installer SHA-256 mismatch.' }
          "INSTALLER_PATH=$path" | Add-Content $env:GITHUB_ENV

      - name: Install the published desktop candidate
        shell: pwsh
        run: |
          if ($env:VERSION -ne '0.1.1' -or $env:RELEASE_SHA256 -ne '3fde43a8a81fbeae41bbbdb896d4e976407d5c3fe01b3fc03973cf3a8143d041') { throw 'Unexpected candidate.' }
          if (Test-Path "$env:APPDATA/com.findmyshit.fms") { throw 'Expected a fresh profile.' }
          $dir = Join-Path $env:RUNNER_TEMP 'FMS desktop test'
          $setup = Start-Process $env:INSTALLER_PATH -ArgumentList "/S /D=$dir" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw 'Installation failed.' }
          $exe = Join-Path $dir 'fms.exe'
          if ((Get-Item $exe).VersionInfo.ProductVersion -notmatch '^0\.1\.1(?:\.0)?$') { throw 'Unexpected installed version.' }
          "FMS_TEST_EXE=$exe" >> $env:GITHUB_ENV

      - name: Verify Windows launch-at-login registration
        shell: powershell
        run: ./tests/desktop-accessibility.ps1 login

      - name: Save and copy a synthetic credential
        if: "!cancelled() && env.FMS_TEST_EXE != ''"
        shell: powershell
        run: ./tests/desktop-accessibility.ps1 credential

      - name: Save a synthetic account
        if: "!cancelled() && env.FMS_TEST_EXE != ''"
        shell: powershell
        run: ./tests/desktop-accessibility.ps1 account

      - name: Scan, link and reveal a project
        if: "!cancelled() && env.FMS_TEST_EXE != ''"
        shell: powershell
        run: ./tests/desktop-accessibility.ps1 scan

      - name: Export then restore into a fresh profile
        if: "!cancelled() && env.FMS_TEST_EXE != ''"
        shell: powershell
        run: ./tests/desktop-accessibility.ps1 backup

      - name: Exercise Explorer tray menu
        if: "!cancelled() && env.FMS_TEST_EXE != ''"
        shell: powershell
        run: ./tests/desktop-tray.ps1

      - name: Download the public installer in Edge
        if: "!cancelled() && env.FMS_TEST_EXE != ''"
        shell: powershell
        run: ./tests/desktop-download.ps1

      - name: Scan the verified installer with Microsoft Defender
        if: "!cancelled() && env.INSTALLER_PATH != ''"
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $status=Get-MpComputerStatus
          if (-not $status.AntivirusEnabled -or -not $status.AMServiceEnabled) { throw 'The runner has no active Defender antivirus engine.' }
          Write-Host "Microsoft Defender signatures $($status.AntivirusSignatureVersion), updated $($status.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('u'))"
          Start-MpScan -ScanType CustomScan -ScanPath $env:INSTALLER_PATH
          $matches=@(Get-MpThreatDetection | Where-Object { ($_.Resources -join '|').Contains($env:INSTALLER_PATH) })
          if ($matches.Count -or -not (Test-Path $env:INSTALLER_PATH)) { throw 'Defender reported or removed the test installer.' }
          Write-Host 'PASS: Custom scan completed with no detection recorded for the verified installer.'
